name: Teacher

on:
  push:
    branches:
      - main
    paths:
      - 'drafts/**/*.md'

jobs:
  teacher:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed markdown files
        id: changed-files
        run: |
          # Get all changed files and filter for markdown in drafts/
          changed=$(git diff --name-only HEAD~1 HEAD | grep '^drafts/.*\.md$' || echo "")
          if [ -z "$changed" ]; then
            echo "No markdown files changed in drafts/"
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "Changed files:"
            echo "$changed"
            # Convert to JSON array for matrix
            files_json=$(echo "$changed" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "files=$files_json" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.changed-files.outputs.files != '' && steps.changed-files.outputs.files != '[]'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.changed-files.outputs.files != '' && steps.changed-files.outputs.files != '[]'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Teacher on each changed draft
        if: steps.changed-files.outputs.files != '' && steps.changed-files.outputs.files != '[]'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '${{ steps.changed-files.outputs.files }}' | jq -r '.[]' | while read file; do
            echo "Teacher reviewing: $file"
            python scripts/teacher.py "$file"
          done

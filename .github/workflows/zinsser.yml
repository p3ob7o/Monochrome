name: Zinsser

on:
  issues:
    types: [labeled]

jobs:
  zinsser:
    # Only run when zinsser-ready label is added
    if: github.event.label.name == 'zinsser-ready'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract filename from issue labels
        id: extract-filename
        env:
          LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          # Find the label that looks like a filename (ends with .md)
          filename=$(echo "$LABELS" | jq -r '.[] | select(.name | endswith(".md")) | .name' | head -1)
          if [ -z "$filename" ]; then
            echo "No markdown filename found in issue labels"
            exit 1
          fi
          echo "filename=$filename" >> $GITHUB_OUTPUT
          echo "Found filename: $filename"

      - name: Check if file exists
        id: check-file
        run: |
          filepath="drafts/${{ steps.extract-filename.outputs.filename }}"
          if [ -f "$filepath" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "filepath=$filepath" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "File not found: $filepath"
          fi

      - name: Set up Python
        if: steps.check-file.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check-file.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Zinsser review
        if: steps.check-file.outputs.exists == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Zinsser reviewing: ${{ steps.check-file.outputs.filepath }}"
          python scripts/zinsser.py "${{ steps.check-file.outputs.filepath }}"

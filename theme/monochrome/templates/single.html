<main class="wp-block-group single-photo">

		<div class="wp-block-columns single-photo__meta-row">
			<!-- wp:column {"className":"single-photo__meta-left"} -->
			<div class="wp-block-column single-photo__meta-left">
				<!-- wp:post-title {"level":1,"className":"single-photo__title","style":{"typography":{"fontSize":"var:preset|font-size|3-xl","fontStyle":"normal","fontWeight":"500","lineHeight":"1.15"},"spacing":{"margin":{"top":"0","bottom":"0"}}},"fontFamily":"space-grotesk"} /-->
			</div>
			<!-- /wp:column -->

			<!-- wp:column {"className":"single-photo__meta-right"} -->
			<div class="wp-block-column single-photo__meta-right">
				<!-- wp:post-date {"format":"Y-m-d","className":"single-photo__date","style":{"typography":{"fontSize":"var:preset|font-size|sm"},"color":{"text":"var:custom|color-text-secondary"},"spacing":{"margin":{"top":"0","bottom":"0"}}},"fontFamily":"space-grotesk"} /-->

			<!-- /wp:column -->
		</div>

		<!-- /wp:separator -->
	</div>
	<!-- /wp:group -->

	<!-- Writing / post content -->

		<!-- wp:post-content {"layout":{"type":"constrained","contentSize":"65ch"}} /-->
	</div>
	<!-- /wp:group -->

	<!-- wp:template-part {"slug":"subscribe"} /-->

	<!-- Prev/Next navigation -->

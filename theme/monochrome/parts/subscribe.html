<!-- wp:html -->
<section class="subscribe" aria-label="Subscribe to Monochrome">
	<div class="subscribe__inner">
		<h2 class="subscribe__heading">Subscribe to Monochrome</h2>
		<form class="subscribe__form" action="" method="post">
			<div class="subscribe__fields">
				<label for="subscribe-email" class="screen-reader-text">Email address</label>
				<input
					type="email"
					id="subscribe-email"
					name="email"
					class="subscribe__input"
					placeholder="Email address"
					required
					autocomplete="email"
				/>
				<button type="submit" class="subscribe__button">Subscribe</button>
			</div>
		</form>
		<p class="subscribe__privacy">We respect your privacy.</p>
	</div>
</section>
<!-- /wp:html -->
